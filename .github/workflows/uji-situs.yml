# Uji asap: buka situs sungguhan dengan build nightly Linux di layar virtual, lalu simpan
# tangkapan layar + pemakaian RAM. Hasilnya dipasang di cabang `tangkapan-layar` supaya bisa
# dilihat langsung di GitHub, dan juga sebagai artifact workflow.
name: Uji situs

on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uji-situs
  cancel-in-progress: true

jobs:
  uji:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Paket pendukung
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb imagemagick libegl1 libgl1-mesa-dri \
            libgles2 libxkbcommon-x11-0 libunwind8 fonts-noto-core fonts-noto-color-emoji

      - name: Unduh build nightly Linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nightly -p 'Lumen-Nightly-linux-x64.tar.gz' -D .
          tar -xzf Lumen-Nightly-linux-x64.tar.gz

      - name: Buka situs dan ambil tangkapan layar
        run: |
          set -u
          mkdir -p hasil
          Xvfb :99 -screen 0 1366x768x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          {
            echo "# Hasil uji situs Lumen"
            echo
            echo "Build: $(cat Lumen/VERSI.txt) · dijalankan $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| Situs | RAM (RSS) | Iklan/pelacak diblokir |"
            echo "|---|---|---|"
          } > hasil/README.md
          while read -r nama url; do
            [ -n "$nama" ] || continue
            rm -rf data && mkdir data
            cp -r Lumen/Data/filters data/ 2>/dev/null || true
            LUMEN_DATA="$PWD/data" RUST_LOG=lumen=info Lumen/lumen "$url" > "hasil/$nama.log" 2>&1 &
            pid=$!
            sleep 25
            import -window root "hasil/$nama.png" || true
            rss=$(ps -o rss= -p "$pid" | awk '{printf "%.0f MB", $1/1024}')
            kill "$pid" 2>/dev/null; sleep 2; kill -9 "$pid" 2>/dev/null || true
            diblokir=$(grep -c "Diblokir:" "hasil/$nama.log" || true)
            echo "| [$nama]($url) | ${rss:-macet} | $diblokir |" >> hasil/README.md
          done <<'DAFTAR'
          berita-kompas https://www.kompas.com/
          berita-detik https://www.detik.com/
          gambar-unsplash https://unsplash.com/
          gambar-wikimedia https://commons.wikimedia.org/wiki/Main_Page
          video-youtube https://www.youtube.com/
          video-vimeo https://vimeo.com/
          ensiklopedia-wikipedia https://id.wikipedia.org/
          DAFTAR
          echo >> hasil/README.md
          for f in hasil/*.png; do n=$(basename "$f" .png); printf '## %s\n\n![%s](%s.png)\n\n' "$n" "$n" "$n" >> hasil/README.md; done
          cat hasil/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: tangkapan-layar
          path: hasil/

      - name: Pasang di cabang tangkapan-layar
        run: |
          cd hasil
          git init -q -b tangkapan-layar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Tangkapan layar uji situs"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tangkapan-layar

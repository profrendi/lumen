# Build nightly portabel Lumen untuk Windows dan Linux.
# Hasilnya dipasang di rilis bergulir bertanda `nightly` (selalu berisi build terbaru).
name: Nightly

on:
  schedule:
    - cron: "17 19 * * *" # tiap hari 02.17 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/**"
      - ".github/workflows/nightly.yml"

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            # ANGLE (Direct3D 11): jalan juga di GPU lama yang driver OpenGL-nya bermasalah.
            features: angle
          - name: linux-x64
            os: ubuntu-22.04
            features: ""
    steps:
      - uses: actions/checkout@v4

      - name: Cap build
        shell: bash
        run: echo "LUMEN_BUILD=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependensi build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev cmake pkg-config m4 \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-shm0-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev libunwind-dev libdbus-1-dev libudev-dev libssl-dev
          # Runner Ubuntu 22.04 punya beberapa versi LLVM. Tanpa ini bindgen (mozangle) bisa memuat
          # libclang versi lain dari header clang 14 dan gagal dengan "undeclared identifier __builtin_ia32_*".
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"
          echo "CLANG_PATH=/usr/bin/clang-14" >> "$GITHUB_ENV"

      - name: Dependensi build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Uji
        shell: bash
        run: cargo test --release --locked --features "${{ matrix.features }}"

      - name: Build
        shell: bash
        run: cargo build --release --locked --features "${{ matrix.features }}"

      - name: Susun folder portabel
        shell: bash
        run: |
          set -euo pipefail
          out="dist/Lumen"
          mkdir -p "$out/Data"
          cp README.md LICENSE packaging/filters.list "$out/"
          cp packaging/blocklist-contoh.txt "$out/Data/blocklist-contoh.txt"
          echo "$LUMEN_BUILD" > "$out/VERSI.txt"

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/lumen.exe "$out/"
            cp packaging/windows/*.bat "$out/"
            # ANGLE: dua DLL ini dibangun oleh crate mozangle dan harus berada di sebelah lumen.exe.
            for dll in libEGL.dll libGLESv2.dll; do
              found="$(find target/release/build -path '*mozangle*' -name "$dll" | head -n 1)"
              if [ -z "$found" ]; then echo "::error::$dll tidak ditemukan"; exit 1; fi
              cp "$found" "$out/"
            done
            # Runtime Visual C++ (MSVCP140, VCRUNTIME140, VCRUNTIME140_1). Banyak PC kantor tidak punya
            # (atau punya versi lama) dan memasangnya butuh admin, jadi DLL-nya ikut di folder Lumen
            # (penyebaran "app-local" yang diizinkan Microsoft). Windows memeriksa folder program dulu.
            vs="$(cygpath -u "$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath)")"
            crt="$(ls -d "$vs"/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT | sort -V | tail -n 1)"
            echo "Runtime VC++ dari: $crt"
            cp "$crt"/msvcp140*.dll "$crt"/vcruntime140*.dll "$out/"
            for dll in MSVCP140.dll VCRUNTIME140.dll VCRUNTIME140_1.dll; do
              [ -f "$out/$dll" ] || [ -f "$out/${dll,,}" ] || { echo "::error::$dll tidak ikut terpaket"; exit 1; }
            done
            ls -la "$out"
          else
            cp target/release/lumen "$out/"
            cp packaging/linux/*.sh "$out/"
            chmod +x "$out/lumen" "$out"/*.sh
          fi

          # Daftar filter adblock (EasyList, EasyPrivacy, ABPindo, uBlock). Kalau ada yang gagal
          # terunduh, daftar lain dan daftar kecil bawaan di dalam program tetap aktif.
          mkdir -p "$out/Data/filters"
          grep -v '^#' packaging/filters.list | while read -r nama url; do
            [ -n "$nama" ] || continue
            curl -fsSL --retry 3 "$url" -o "$out/Data/filters/$nama" \
              || echo "::warning::$nama tidak terunduh"
          done

      - name: Kemas
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip -mx=9 "../Lumen-Nightly-${{ matrix.name }}.zip" Lumen
          else
            tar -czf "../Lumen-Nightly-${{ matrix.name }}.tar.gz" Lumen
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Nightly-${{ matrix.name }}
          path: Lumen-Nightly-${{ matrix.name }}.*
          if-no-files-found: error

      - name: Perbarui rilis nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Lumen Nightly
          prerelease: true
          make_latest: false
          body: |
            Build otomatis terbaru (${{ env.LUMEN_BUILD }}).
            Ekstrak lalu jalankan `lumen` dari dalam folder `Lumen`. Tidak perlu instalasi.
          files: Lumen-Nightly-${{ matrix.name }}.*

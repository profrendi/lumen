<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #dfe3e8; --tab: transparent; --tab-hover: #eceff3; --tab-active: #ffffff;
    --bar: #ffffff; --field: #eef1f4; --field-focus: #ffffff; --text: #1d2228; --muted: #5d6670;
    --line: #c9cfd6; --accent: #1863dc; --shield: #e8730c; --ok: #148a4a; --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1f23; --tab-hover: #2a2e34; --tab-active: #33383f; --bar: #33383f; --field: #24282d;
      --field-focus: #1c1f23; --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8;
      --shield: #ff9a3d; --ok: #5fd08f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  #tabs { height: 36px; display: flex; align-items: flex-end; padding: 0 6px; gap: 2px; }
  .tab { position: relative; flex: 0 1 220px; min-width: 48px; height: 30px; display: flex; align-items: center;
    gap: 7px; padding: 0 6px 0 10px; border-radius: 8px 8px 0 0; background: var(--tab); cursor: default; }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--tab-active); }
  .tab .ic { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); }
  .tab.sleep .ic { background: var(--muted); }
  .tab.sleep .t { color: var(--muted); font-style: italic; }
  .tab .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { flex: none; width: 20px; height: 20px; border: 0; border-radius: 50%; background: none; color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer; }
  .tab .x:hover { background: var(--line); color: var(--text); }
  .tab.loading .ic { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #new { flex: none; width: 28px; height: 28px; margin-bottom: 2px; border: 0; border-radius: 6px; background: none;
    color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }
  #new:hover { background: var(--tab-hover); }
  #bar { height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--bar);
    border-bottom: 1px solid var(--line); }
  .b { flex: none; width: 32px; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--text);
    display: grid; place-items: center; cursor: pointer; }
  .b:hover { background: var(--field); }
  .b svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #addr { flex: 1; min-width: 0; height: 30px; border: 1px solid transparent; border-radius: 15px; padding: 0 14px;
    background: var(--field); color: var(--text); font: inherit; font-size: 14px; outline: none; user-select: text; }
  #addr:focus { background: var(--field-focus); border-color: var(--accent); }
  #shield { width: auto; min-width: 32px; padding: 0 8px; gap: 4px; display: flex; align-items: center; color: var(--shield); font-weight: 600; }
  #shield.off { color: var(--muted); }
  #shield.off svg { stroke-dasharray: 3 2; }
  #upd { display: none; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: var(--ok); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; }
  #upd.show { display: block; }
</style>
</head>
<body>
<div id="tabs"><button id="new" title="Tab baru (Ctrl+T)">+</button></div>
<div id="bar">
  <button class="b" id="back" title="Kembali (Alt+←)"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
  <button class="b" id="fwd" title="Maju (Alt+→)"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <button class="b" id="reload" title="Muat ulang (F5)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
  <input id="addr" spellcheck="false" autocomplete="off" placeholder="Cari atau ketik alamat">
  <button id="upd" title="Versi baru sudah diunduh. Klik untuk membuka ulang Ovner."></button>
  <button class="b" id="shield" title=""><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/></svg><span id="count"></span></button>
  <button class="b" id="menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<script>
(function () {
  const send = (o) => window.ipc.postMessage(JSON.stringify(o));
  const $ = (id) => document.getElementById(id);
  const tabsEl = $("tabs"), addr = $("addr");
  let state = { tabs: [], url: "", loading: false };
  const reloadIcon = $("reload").innerHTML;
  const stopIcon = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function letter(t) {
    const m = (t.title || t.url || "").replace(/^https?:\/\/(www\.)?/, "").match(/[A-Za-z0-9]/);
    return m ? m[0].toUpperCase() : "•";
  }

  function renderTabs() {
    tabsEl.querySelectorAll(".tab").forEach((e) => e.remove());
    const plus = $("new");
    for (const t of state.tabs) {
      const el = document.createElement("div");
      el.className = "tab" + (t.active ? " active" : "") + (t.sleeping ? " sleep" : "") + (t.loading ? " loading" : "");
      el.title = (t.title || "Tab baru") + (t.sleeping ? "\n(Tab tidur: tidak memakai RAM, dimuat lagi saat dibuka)" : "");
      const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = letter(t);
      const ti = document.createElement("span"); ti.className = "t"; ti.textContent = t.title || "Tab baru";
      const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "Tutup tab (Ctrl+W)";
      x.onclick = (e) => { e.stopPropagation(); send({ cmd: "close", id: t.id }); };
      el.onmousedown = (e) => { if (e.button === 0) send({ cmd: "activate", id: t.id }); };
      el.onauxclick = (e) => { if (e.button === 1) send({ cmd: "close", id: t.id }); };
      el.append(ic, ti, x);
      tabsEl.insertBefore(el, plus);
    }
  }

  window.ovner = {
    render(s) {
      state = s;
      renderTabs();
      if (document.activeElement !== addr) addr.value = s.url;
      $("reload").innerHTML = s.loading ? stopIcon : reloadIcon;
      $("reload").title = s.loading ? "Hentikan (Esc)" : "Muat ulang (F5)";
      const sh = $("shield");
      sh.classList.toggle("off", !s.shieldOn);
      $("count").textContent = s.shieldOn && s.blocked > 0 ? String(s.blocked) : "";
      sh.title = !s.blockAds ? "Pemblokir iklan dimatikan di pengaturan"
        : !s.shieldOn ? "Pemblokir iklan MATI di situs ini. Klik untuk menyalakan lagi."
        : `${s.blocked} iklan/pelacak diblokir di halaman ini${s.listsReady ? "" : " (daftar lengkap sedang diunduh)"}.\nKlik untuk mematikan pemblokir di situs ini.`;
      const u = $("upd");
      u.classList.toggle("show", !!s.update);
      u.textContent = s.update ? "Update " + s.update : "";
    },
    focusAddress() {
      addr.focus();
      addr.select();
    },
  };

  addr.addEventListener("focus", () => setTimeout(() => addr.select(), 0));
  addr.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const text = addr.value.trim();
      if (text) send({ cmd: "go", text });
      addr.blur();
    } else if (e.key === "Escape") {
      addr.value = state.url;
      addr.blur();
      send({ cmd: "focus-page" });
    }
  });
  $("new").onclick = () => send({ cmd: "newtab" });
  $("back").onclick = () => send({ cmd: "back" });
  $("fwd").onclick = () => send({ cmd: "forward" });
  $("reload").onclick = () => send({ cmd: state.loading ? "stop" : "reload" });
  $("shield").onclick = () => send({ cmd: "shield" });
  $("upd").onclick = () => send({ cmd: "restart" });
  $("menu").onclick = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    send({ cmd: "menu", x: r.right, y: r.bottom });
  };
  // Pintasan saat fokus di toolbar (saat fokus di halaman, ditangani skrip halaman).
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    let c = null;
    if (e.ctrlKey && !e.altKey) {
      if (k === "t") c = e.shiftKey ? "reopen" : "newtab";
      else if (k === "w" || k === "f4") c = "close";
      else if (k === "l") { e.preventDefault(); window.ovner.focusAddress(); return; }
      else if (k === "tab" || k === "pagedown") c = e.shiftKey || k === "pageup" ? "prevtab" : "nexttab";
      else if (k === "pageup") c = "prevtab";
      else if (/^[1-9]$/.test(k)) c = "tab" + k;
    } else if (k === "f5") c = "reload";
    if (c) { e.preventDefault(); send({ cmd: "key", k: c }); }
  });
  document.addEventListener("contextmenu", (e) => { if (e.target !== addr) e.preventDefault(); });
  send({ cmd: "ready" });
})();
</script>
</body>
</html>
